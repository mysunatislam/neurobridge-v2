name: Deploy FingerSpeak Web App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build & Prerender for GitHub Pages
        working-directory: apps/web
        run: |
          npm run build
          node ./prerender-pages.mjs ./pages-dist --base=/${{ github.event.repository.name }} --serve-check

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/pages-dist
          publish_branch: gh-pages
          force_orphan: true
